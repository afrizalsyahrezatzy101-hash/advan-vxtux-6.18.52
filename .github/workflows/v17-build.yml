name: Build V17 VXTux Kernel

on:
  workflow_dispatch:
  push:
    branches: [main, test1, v17-build]

jobs:
  build-v17:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: test1
          fetch-depth: 1
          
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu libncurses-dev flex bison bc libssl-dev libelf-dev
          
      - name: Apply enhanced config
        run: |
          cd 6.18.52-VXTux-UMS512
          cp .config .config.original
          cp ../enhanced_config.cfg .config
          
      - name: Build kernel
        run: |
          cd 6.18.52-VXTux-UMS512
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image dtbs -j$(nproc)
          
      - name: Setup git for push
        run: |
          git config user.email "archanaberry101originally@gmail.com"
          git config user.name "Berry Chan"
          
      - name: Copy Image to root
        run: |
          mkdir -p output
          cp 6.18.52-VXTux-UMS512/arch/arm64/boot/Image output/v17_Image
          cp -r 6.18.52-VXTux-UMS512/arch/arm64/boot/dts/sprd/ output/v17_dtb/ 2>/dev/null || true
          ls -la output/
          
      - name: Push to output branch
        run: |
          git checkout -B v17-output
          git add output/
          git commit -m "V17 build: Image $(date +%s)" || echo "no changes"
          git push -f origin v17-output
