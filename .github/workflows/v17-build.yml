name: Build V17 VXTux Kernel

on:
  workflow_dispatch:
  push:
    branches: [main, test1, v17-build]

jobs:
  build-v17:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: test1
          fetch-depth: 1
          path: src
          
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu libncurses-dev flex bison bc libssl-dev libelf-dev
          
      - name: Build kernel
        run: |
          cd src/6.18.52-VXTux-UMS512
          # Apply enhanced config
          cp .config .config.original
          cp ../../enhanced_config.cfg .config 2>/dev/null || cp ../enhanced_config.cfg .config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image dtbs -j$(nproc)
          
      - name: Setup git output
        run: |
          mkdir -p output
          cp src/6.18.52-VXTux-UMS512/arch/arm64/boot/Image output/v17_Image
          ls -la output/
          
      - name: Create new repo for output
        run: |
          # Use a separate clone of the repo for output
          cd $GITHUB_WORKSPACE
          git config user.email "archanaberry101originally@gmail.com"
          git config user.name "Berry Chan"
          # Create orphan branch
          git checkout --orphan v17-images
          git rm -rf . 2>/dev/null || true
          cp -r output/. .
          git add .
          git commit -m "V17 Image build - $(date -u +%Y-%m-%dT%H:%M:%SZ)" --allow-empty
          # Try to push
          git push origin v17-images --force 2>&1 | head -20 || echo "PUSH_FAILED"
