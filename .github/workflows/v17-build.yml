name: Build V17 VXTux Kernel

on:
  workflow_dispatch:
  push:
    branches: [main, test1, v17-build]

jobs:
  build-v17:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: test1
          fetch-depth: 1
          
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu libncurses-dev flex bison bc libssl-dev libelf-dev
          
      - name: Apply enhanced config
        run: |
          cd 6.18.52-VXTux-UMS512
          cp .config .config.original
          cp ../enhanced_config.cfg .config
          
      - name: Build kernel
        run: |
          cd 6.18.52-VXTux-UMS512
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image dtbs -j$(nproc)
          echo "=== BUILD ARTIFACTS ==="
          ls -la arch/arm64/boot/Image
          ls -la arch/arm64/boot/dts/sprd/ 2>/dev/null | head -5
          
      - name: Stage Image for commit
        run: |
          cd 6.18.52-VXTux-UMS512
          # Copy Image out to repo root
          mkdir -p ../output
          cp arch/arm64/boot/Image ../output/v17_Image
          # Don't copy dtbs (too many, small) - just list
          ls arch/arm64/boot/dts/sprd/ 2>/dev/null | head > ../output/dtb_list.txt || echo "no dtbs"
          cd ..
          ls -la output/
          
      - name: Commit Image to v17-image branch
        run: |
          cd ..
          git config user.email "archanaberry101originally@gmail.com"
          git config user.name "Berry Chan"
          # Switch to v17-image branch
          git checkout -B v17-image
          git add output/
          # Use --allow-empty in case file is identical
          git commit -m "V17 build artifact - $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "no changes to commit"
          # Push with no force
          git push origin v17-image --force-with-lease || git push origin v17-image
