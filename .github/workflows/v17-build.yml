name: Build V17 VXTux Kernel

on:
  workflow_dispatch:
  push:
    branches: [main, test1, v17-build]

jobs:
  build-v17:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: test1
          fetch-depth: 1
          
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu libncurses-dev flex bison bc libssl-dev libelf-dev
          
      - name: Fix permissions and apply config
        run: |
          cd 6.18.52-VXTux-UMS512
          # Make ALL executable files in scripts/ executable (not just .sh)
          find scripts/ -type f -exec chmod +x {} +
          ls -la scripts/remove-stale-files
          # Apply enhanced config
          cp .config .config.original
          cp ../enhanced_config.cfg .config
          
      - name: Build kernel Image
        run: |
          cd 6.18.52-VXTux-UMS512
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
      - name: Force clean stale .o files
        run: |
          cd 6.18.52-VXTux-UMS512
          # Keeping cached object files so recompiles are faster (no delete)
          # Archive all built .o files for transport
          find fs/f2fs fs/btrfs fs/fuse drivers/pmdomain/sprd -name '*.o' -print0 | tar --null -czf berry-objs.tar.gz -T -
          ls -la berry-objs.tar.gz
          
      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: v17-image-only
          path: 6.18.52-VXTux-UMS512/arch/arm64/boot/Image
          if-no-files-found: error
