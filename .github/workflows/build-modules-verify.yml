name: Build modules for verify
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test1
          fetch-depth: 1
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y build-essential gcc-aarch64-linux-gnu libncurses-dev flex bison bc libssl-dev libelf-dev
      - name: Apply config and build modules
        run: |
          cd 6.18.52-VXTux-UMS512
          find scripts/ -type f -exec chmod +x {} +
          cp ../enhanced_config.cfg .config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules -j$(nproc)
      - name: Tar .ko tree
        run: |
          cd 6.18.52-VXTux-UMS512
          find . -name '*.ko' | tar -czf /tmp/built_kos.tar.gz -T -
          ls -lh /tmp/built_kos.tar.gz
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: built-kos
          path: /tmp/built_kos.tar.gz
          if-no-files-found: error
